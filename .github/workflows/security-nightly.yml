# =============================================================================
# YoYu Security Nightly Scan（每日凌晨安全扫描）
# =============================================================================
# 用途：跑全量 universal_baseline 检查但**不阻断**（只生成报告）
# 触发：cron 每天凌晨 3 点（UTC） + 手动触发
#
# 与 ci.yml 的区别：
#   - ci.yml 失败 = PR 阻断；nightly 失败 = 只发 GitHub Issue / 通知
#   - nightly 跑得更深（npm audit 包括 moderate / low）
#   - nightly 跑得更广（未来扩展到 full SCA 扫描如 Snyk）
#
# 配套使用：
#   - .github/CODEOWNERS 自动通知安全 owner
#   - 失败时自动开 issue（可用 github-script action 加）
# =============================================================================

name: Security Nightly

on:
  schedule:
    - cron: "0 3 * * *"                                 # 每天 UTC 3 点（北京时间 11 点）
  workflow_dispatch:                                     # 允许手动触发

# 不设 concurrency —— 夜间跑不怕重叠；失败时希望都跑完出报告

jobs:
  security-audit:
    name: 🛡️ Security Audit (full depth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install all deps
        run: |
          npm ci
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..

      # ── 1) Secret 扫描（含 gitleaks if available） ──
      - name: Gitleaks (if available)
        run: |
          if command -v gitleaks &> /dev/null; then
            gitleaks detect --source . --no-banner -v
          else
            echo "⚠️  gitleaks 未安装，用 scripts/security-scan.sh 兜底"
          fi
        continue-on-error: false

      - name: Security scan fallback
        if: failure()                                        # gitleaks 失败时跑兜底
        run: npm run security-scan
        continue-on-error: true                              # 兜底也失败不阻断（仅报告）

      # ── 2) Dep audit（full depth：low/moderate 也报） ──
      - name: npm audit (full)
        run: |
          echo "=== Backend ==="
          cd backend && npm audit --audit-level=low || true
          cd ..
          echo "=== Frontend ==="
          cd frontend && npm audit --audit-level=low || true
          cd ..
        # 注意：用 || true — nightly 不阻断，仅收集

      # ── 3) Outdated packages（升级提醒） ──
      - name: Outdated packages
        run: |
          echo "=== Backend ==="
          cd backend && npm outdated || true
          cd ..
          echo "=== Frontend ==="
          cd frontend && npm outdated || true
          cd ..

      # ── 4) 写一个总结到 step summary（GitHub Actions UI 显示） ──
      - name: Summary report
        if: always()
        run: |
          echo "## 🛡️ Nightly Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 后续动作" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] 查看上方各 step 日志" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] 若有 high 漏洞，立即 PR 升级依赖" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] 若有 outdated 主要版本，安排升级 sprint" >> $GITHUB_STEP_SUMMARY